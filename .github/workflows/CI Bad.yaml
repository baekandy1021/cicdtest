name: CI Bad 
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r app/requirements.txt
      - run: python -m pytest

  e2e-tests:
    needs: unit-tests          
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./e2e_tests.sh

  deploy:
    needs: e2e-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy.sh staging ${{ github.sha }}